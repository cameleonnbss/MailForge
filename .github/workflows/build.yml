# language: YAML, file: .github/workflows/build.yml
# Verifie le socle a chaque push, puis construit l'installeur Windows et la
# version portable lorsqu'un tag de version est pousse (v1.0.0, v1.1.0, ...).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntaxe de chaque fichier JS
        shell: bash
        run: |
          failed=0
          for file in $(find src scripts -name '*.js'); do
            node --check "$file" || failed=1
          done
          exit $failed
      - name: Auto-test de l'application
        run: npm run smoke

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Construire installeur + portable
        run: npm run dist
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          name: MailForge ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_v1.0.0.md
          files: |
            release/MailForge-Setup-*.exe
            release/MailForge-*-portable.exe
          draft: false
          prerelease: false
