# language: YAML, file: .github/workflows/build.yml
# verify  : a chaque push et pull request — syntaxe, auto-test de l'application
# package : sur un tag (v1.0.0, ...) ou manuellement — installeur, portable, CLI
#           puis publication de la version si l'evenement est un tag
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verifier la syntaxe de chaque fichier JS
        shell: bash
        run: |
          failed=0
          for file in $(find src scripts -name '*.js'); do
            node --check "$file" || failed=1
          done
          exit $failed
      - name: Auto-test de l'application (12 controles, sans fenetre)
        run: npm run smoke

  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Construire installeur, version portable et archive CLI
        run: npm run release
      - name: Verifier le binaire compile
        shell: bash
        run: |
          MAILFORGE_DATA_DIR="$(pwd)/.ci-data" ./release/win-unpacked/MailForge.exe --smoke
          MAILFORGE_DATA_DIR="$(pwd)/.ci-data" ./release/win-unpacked/MailForge.exe --cli version
      - uses: actions/upload-artifact@v4
        with:
          name: MailForge-${{ github.ref_name }}
          path: |
            release/MailForge-Setup-*.exe
            release/MailForge-*-portable.exe
            release/MailForge-*-cli.zip
          retention-days: 30
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MailForge ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_v1.0.0.md
          files: |
            release/MailForge-Setup-*.exe
            release/MailForge-*-portable.exe
            release/MailForge-*-cli.zip
          draft: false
          prerelease: false
